# Sensor release (step 44b): on a tag sensor-v<version> here, check out the private source at the same tag (read-only
# deploy key), build the sensor image for amd64 + arm64, push ghcr.io/cyber-armor/nis2inv-sensor:<version> with an
# SBOM and a provenance attestation, sign it keyless with cosign (GitHub OIDC) and verify the signature.
# The signature's identity is this workflow at the tag — what the installer checks:
#   https://github.com/cyber-armor/nis2inv-sensor/.github/workflows/release.yml@refs/tags/sensor-v<version>
# Actions are pinned by commit (tag in the comment).
name: release

on:
  push:
    tags: ["sensor-v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # this repo
      packages: write     # push to GHCR
      id-token: write     # cosign keyless (GitHub OIDC)
    env:
      IMAGE: ghcr.io/cyber-armor/nis2inv-sensor
    steps:
      - name: Source at the same tag (private repo, read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cyber-armor/asset-management
          ref: refs/tags/${{ github.ref_name }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Tag matches the sensor version
        id: ver
        working-directory: src
        run: |
          tag="${GITHUB_REF_NAME#sensor-v}"
          code="$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/sensor/main.go)"
          echo "tag $tag, cmd/sensor version $code, source commit $(git rev-parse HEAD)"
          if [ -z "$code" ] || [ "$tag" != "$code" ]; then
            echo "::error::tag sensor-v$tag doesn't match cmd/sensor/main.go version $code"; exit 1
          fi
          echo "version=$code" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile
          build-args: APP=sensor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.title=nis2inv-sensor
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/cyber-armor/nis2inv-sensor
            org.opencontainers.image.revision=${{ steps.ver.outputs.source }}
            org.opencontainers.image.description=NIS2 inventory sensor (L0-L2 discovery)
          provenance: mode=min
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign (keyless) and verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE: ${{ steps.ver.outputs.source }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE:$VERSION" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "### Sensor $VERSION"
            echo
            echo "\`$IMAGE:$VERSION\`"
            echo
            echo "digest \`$DIGEST\` (signed, verified); source commit \`$SOURCE\`"
          } >> "$GITHUB_STEP_SUMMARY"
